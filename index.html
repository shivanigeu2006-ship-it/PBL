<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartStock - Shop inventory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23173b2f'/><rect x='18' y='30' width='64' height='8' rx='2' fill='%23f2b01e'/><rect x='18' y='56' width='64' height='8' rx='2' fill='%23f2b01e'/><rect x='24' y='14' width='14' height='16' fill='%23fff'/><rect x='44' y='18' width='12' height='12' fill='%23fff'/><rect x='30' y='40' width='16' height='16' fill='%23fff'/><rect x='54' y='44' width='18' height='12' fill='%23fff'/></svg>">
<style>
:root{
  --ground:#eef1ee; --panel:#ffffff; --ink:#17251f; --muted:#5d6b64; --line:#d9dfda;
  --pine:#173b2f; --pine-2:#24523f; --tag:#f2b01e; --timber:#a37c4c;
  --crit:#c23b2b; --crit-bg:#fbeae7; --warn:#b97300; --warn-bg:#fdf1db;
  --ok:#2c7a4b; --ok-bg:#e4f3ea; --info:#38679c; --info-bg:#e6eef7;
  --serif:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.15} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:.25rem 0} a{color:var(--pine-2)}
.muted{color:var(--muted)} .small{font-size:.85rem} .right{text-align:right} .nowrap{white-space:nowrap}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--pine);color:#e9f0ec;padding:1.25rem .75rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:.6rem;padding:.25rem .6rem 1.25rem;font-family:var(--serif);font-size:1.3rem;font-weight:700;color:#fff}
.brand i{display:block;width:26px;height:26px;border-radius:6px;background:var(--tag);position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;top:12px;height:3px;background:var(--pine);box-shadow:0 7px 0 var(--pine)}
nav a{display:flex;justify-content:space-between;align-items:center;color:#cfdcd5;text-decoration:none;padding:.5rem .7rem;border-radius:6px;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a.on{background:var(--tag);color:var(--pine);font-weight:700}
nav .count{font-size:.75rem;background:var(--crit);color:#fff;border-radius:9px;padding:0 .45rem;min-width:1.2rem;text-align:center}
main{padding:1.75rem 2rem 4rem;max-width:1280px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap} .row.end{justify-content:flex-end}
.stack>*+*{margin-top:1.25rem}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:.45rem .85rem;border-radius:6px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--pine-2)} .btn.sm{padding:.2rem .55rem;font-size:.85rem}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff} .btn.primary:hover{background:var(--pine-2)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{border:1px solid #bcc6bf;background:#fff;border-radius:6px;padding:.45rem .6rem;width:100%}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:.2rem}
.field{margin-bottom:.8rem} .field .hint{font-weight:400;color:var(--muted);font-size:.8rem}
.search{max-width:320px}

/* ---------- panels, tables ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.25rem}
.panel>h2{margin-bottom:.75rem;display:flex;gap:.5rem;align-items:center}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:1.25rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:8px}
.ledger div{padding:.8rem 1.1rem;border-right:1px solid var(--line)} .ledger div:last-child{border-right:0}
.ledger dt{font-size:.8rem;color:var(--muted)} .ledger dd{margin:0;font-family:var(--serif);font-size:1.45rem;font-weight:700}
.ledger dd.neg{color:var(--crit)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:.55rem .75rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:#f7f9f7;white-space:nowrap}
tr:last-child td{border-bottom:0} td.num,th.num{text-align:right}
tbody tr:hover{background:#f9fbf9}
td .sub{display:block;font-size:.8rem;color:var(--muted)}
.empty{padding:2rem;text-align:center;color:var(--muted)}

/* ---------- badges ---------- */
.pill{display:inline-block;border-radius:10px;padding:.05rem .55rem;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.crit,.pill.expired,.pill.out_of_stock,.pill.critical{background:var(--crit-bg);color:var(--crit)}
.pill.warn,.pill.reorder,.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.ok,.pill.High{background:var(--ok-bg);color:var(--ok)}
.pill.info,.pill.overstock,.pill.Medium{background:var(--info-bg);color:var(--info)}
.pill.Low,.pill.none{background:#eceeec;color:#555}

/* ---------- alerts ---------- */
.alert{display:grid;grid-template-columns:5px 1fr auto;gap:.75rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .bar{align-self:stretch;border-radius:3px;background:var(--info)} .alert.critical .bar{background:var(--crit)} .alert.warning .bar{background:var(--tag)}
.alert .type{font-size:.78rem;font-weight:700;color:var(--muted)}

/* ---------- bars & charts ---------- */
.meter{height:8px;background:#e4e9e5;border-radius:4px;overflow:hidden;min-width:70px} .meter b{display:block;height:100%;background:var(--pine-2)}
.meter.hot b{background:var(--crit)} .meter.warm b{background:var(--tag)}
.healthbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:.4rem 0 .6rem}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.35rem}
.toplist{list-style:none;margin:0;padding:0} .toplist li{display:grid;grid-template-columns:1fr 70px;gap:.5rem;padding:.35rem 0;align-items:center}
svg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}

/* ---------- shelves ---------- */
.shelf{margin-bottom:1.4rem}
.shelf header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:.35rem}
.shelf .track{display:flex;height:64px;background:repeating-linear-gradient(90deg,#f7f9f7 0 6px,#f1f4f1 6px 7px);border:1px solid var(--line);border-bottom:10px solid var(--timber);border-radius:6px 6px 0 0;overflow:hidden}
.shelf .item{height:100%;border-right:2px solid #fff;padding:.25rem .35rem;font-size:.75rem;line-height:1.15;overflow:hidden;background:var(--ok-bg);border-top:4px solid var(--ok);position:relative;cursor:default}
.shelf .item.reorder{background:var(--warn-bg);border-top-color:var(--tag)} .shelf .item.out_of_stock{background:var(--crit-bg);border-top-color:var(--crit)}
.shelf .item.overstock{background:var(--info-bg);border-top-color:var(--info)}
.shelf .item b{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.shelf .item .exp{position:absolute;right:0;bottom:0;top:auto;height:10px;background:repeating-linear-gradient(45deg,var(--crit) 0 4px,#fff 4px 8px)}
.shelf .free{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem}

/* ---------- dialog & toast ---------- */
dialog{border:0;border-radius:10px;padding:1.4rem;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--ink)}
dialog::backdrop{background:rgba(23,37,31,.5)}
dialog h2{margin-bottom:.4rem}
.formerr{color:var(--crit);font-weight:600;min-height:1.2rem;margin:.2rem 0 .6rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem} .fields .field.wide{grid-column:1/-1}
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50}
.toast{background:var(--pine);color:#fff;padding:.7rem 1rem;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:380px}
.toast.err{background:var(--crit)}
.po{border:1px dashed #b9c3bc;border-radius:8px;padding:.8rem 1rem;background:#fbfcfb}
.po ul{margin:.4rem 0;padding-left:1.1rem}

@media (max-width:900px){
  .shell{grid-template-columns:1fr} nav{position:static;height:auto;display:flex;overflow-x:auto;padding:.5rem;gap:2px}
  .brand{display:none} nav a{white-space:nowrap;margin:0}
  main{padding:1rem 1rem 3rem} .grid2,.grid3{grid-template-columns:1fr} .fields{grid-template-columns:1fr}
  .ledger div{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:no-preference){ .meter b{transition:width .4s} }
@media print{ nav,.btn,#toasts{display:none!important} .shell{display:block} }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="Main">
    <div class="brand"><i></i>SmartStock</div>
    <a href="#dashboard" data-r="dashboard">Dashboard</a>
    <a href="#alerts" data-r="alerts">Alerts <span class="count" id="alertcount" hidden></span></a>
    <a href="#products" data-r="products">Products</a>
    <a href="#sales" data-r="sales">Sales</a>
    <a href="#shelves" data-r="shelves">Shelves</a>
    <a href="#expiry" data-r="expiry">Expiry (FEFO)</a>
    <a href="#reorder" data-r="reorder">Reorder</a>
    <a href="#demand" data-r="demand">Demand</a>
    <a href="#profit" data-r="profit">Profit</a>
    <a href="#suppliers" data-r="suppliers">Suppliers</a>
    <a href="#data" data-r="data">Data</a>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ===================== helpers ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 2});
const inr0 = n => "₹" + Math.round(Number(n || 0)).toLocaleString("en-IN");
const num = (n, d = 1) => Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: d});
const fdate = s => s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short", year: "numeric"}) : "No expiry";
const STATUS = {ok: "Healthy", reorder: "Reorder", out_of_stock: "Out of stock", overstock: "Overstock"};
const EXPSTATUS = {expired: "Expired", critical: "Expires within a day", soon: "Expiring soon", ok: "Fresh"};

async function api(method, path, body) {
  let res;
  try {
    res = await fetch("/api" + path, {method, headers: {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  } catch (e) { throw new Error("Cannot reach the SmartStock server. Is it still running?"); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3500);
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }
const pill = (cls, text) => `<span class="pill ${esc(cls)}">${esc(text)}</span>`;
const meter = (pct, cls = "") => `<div class="meter ${cls}"><b style="width:${Math.max(0, Math.min(100, pct))}%"></b></div>`;
const empty = msg => `<div class="empty">${msg}</div>`;

/* ===================== dialog / forms ===================== */
function fieldHTML(f) {
  const id = "f_" + f.name, req = f.required ? " required" : "";
  let input;
  if (f.type === "select")
    input = `<select id="${id}" name="${f.name}"${req}>${f.options.map(o => `<option value="${esc(o.v)}"${String(o.v) === String(f.value ?? "") ? " selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`;
  else
    input = `<input id="${id}" name="${f.name}" type="${f.type || "text"}" value="${esc(f.value ?? "")}"${req}${f.min !== undefined ? ` min="${f.min}"` : ""}${f.step ? ` step="${f.step}"` : ""}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ""}${f.list ? ` list="${f.list}"` : ""}${f.disabled ? " disabled" : ""}>`;
  return `<div class="field${f.wide ? " wide" : ""}"><label for="${id}">${esc(f.label)}</label>${input}${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div>`;
}
function formDialog({title, intro, fields = [], submit = "Save", danger, onSubmit}) {
  const dlg = $("#dlg");
  dlg.innerHTML = `<form id="dlgform" novalidate><h2>${esc(title)}</h2>${intro ? `<div class="muted" style="margin-bottom:.8rem">${intro}</div>` : ""}
    <div class="fields">${fields.map(fieldHTML).join("")}</div><p class="formerr" role="alert"></p>
    <div class="row end"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="dlgsubmit">${esc(submit)}</button></div></form>`;
  const form = $("#dlgform");
  form.onsubmit = async e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const v = {};
    for (const f of fields) {
      const el = form.elements[f.name];
      let val = el.value.trim();
      if (val === "") { if (f.sendEmpty) v[f.name] = ""; continue; }
      v[f.name] = f.type === "number" ? Number(val) : val;
    }
    $("#dlgsubmit").disabled = true;
    try { await onSubmit(v); dlg.close(); }
    catch (err) { $(".formerr", form).textContent = err.message; $("#dlgsubmit").disabled = false; }
  };
  dlg.showModal();
  const first = form.querySelector("input,select"); if (first) first.focus();
}
const confirmDialog = (title, intro, submit, onSubmit) => formDialog({title, intro, submit, danger: true, onSubmit});

/* ===================== reference data ===================== */
const cache = {};
async function refs() {
  const [suppliers, shelves] = await Promise.all([api("GET", "/suppliers"), api("GET", "/shelves")]);
  cache.suppliers = suppliers; cache.shelves = shelves.shelves;
  return cache;
}
const supplierOpts = (blank) => [{v: "", l: blank}].concat(cache.suppliers.map(s => ({v: s.id, l: s.name + " (lead " + s.leadTime + "d)"})));
const shelfOpts = (blank) => [{v: "", l: blank}].concat(cache.shelves.map(s => ({v: s.id, l: s.name + " - " + s.free + " free"})));

/* ===================== router ===================== */
const routes = {};
let current = "dashboard";
async function go() {
  const name = (location.hash || "#dashboard").slice(1);
  current = routes[name] ? name : "dashboard";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.r === current));
  const main = $("#main");
  try { await routes[current](main); }
  catch (e) { main.innerHTML = `<div class="panel"><h2>Something went wrong</h2><p>${esc(e.message)}</p><p><button class="btn primary" data-act="reload">Try again</button></p></div>`; }
  refreshBadge();
}
const reload = () => go();
async function refreshBadge() {
  try {
    const a = await api("GET", "/alerts");
    const n = a.filter(x => x.severity !== "info").length, el = $("#alertcount");
    el.hidden = n === 0; el.textContent = n;
  } catch (e) {}
}
window.addEventListener("hashchange", go);

/* ===================== actions (event delegation) ===================== */
const actions = {
  reload, goto: d => { location.hash = d.to; },
  discard: d => confirmDialog("Write off expired stock", "All expired batches" + (d.sku ? " of " + esc(d.sku) : "") + " will be removed from the shelves and counted as wastage.", "Write off",
    async () => { const r = await api("POST", "/expiry/discard", d.sku ? {sku: d.sku} : {}); toast("Wrote off " + r.units + " units (" + inr(r.loss) + ")"); reload(); }),
  receive: d => receiveDialog(d.sku, Number(d.qty) || ""),
  assign: d => guard(async () => { await api("POST", "/shelves/assign", {sku: d.sku, shelfId: d.shelf}); toast("Moved " + d.sku + " to " + d.shelf); reload(); }),
  copyPO: async d => { await navigator.clipboard.writeText($("#po_" + d.id).innerText).catch(() => {}); toast("Order copied to clipboard"); },
};
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return $("#dlg").close();
  const el = e.target.closest("[data-act]");
  if (el) { e.preventDefault(); const fn = actions[el.dataset.act]; if (fn) guard(() => fn(el.dataset)); }
});
$("#dlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

async function receiveDialog(sku, qty) {
  await refs();
  const p = await api("GET", "/products/" + encodeURIComponent(sku));
  const rows = p.batches.map(b => `<tr><td>${esc(b.id)}</td><td class="num">${b.qty}</td><td>${fdate(b.expiry)}</td></tr>`).join("");
  formDialog({
    title: "Receive stock: " + p.name,
    intro: `<p>On hand: <b>${p.stock}</b> units${p.expired ? ` (${p.expired} expired)` : ""}. Target stock is ${p.target}. ${p.shelfName ? "Shelf: " + esc(p.shelfName) + "." : "Not on a shelf yet - one will be picked automatically."}</p>` +
      (rows ? `<div class="tablewrap" style="margin-top:.5rem"><table><thead><tr><th>Batch</th><th class="num">Qty</th><th>Expiry (sold first at the top)</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""),
    fields: [
      {name: "qty", label: "Quantity received", type: "number", min: 1, required: true, value: qty},
      {name: "expiry", label: "Expiry date", type: "date", sendEmpty: true, hint: "Leave empty for non-perishable goods"},
    ],
    submit: "Add batch",
    onSubmit: async v => { await api("POST", "/products/" + encodeURIComponent(sku) + "/batches", v); toast("Added " + v.qty + " units of " + p.name); reload(); },
  });
}

/* ===================== pages ===================== */
const ALERT_ACTION = {
  EXPIRED: a => `<button class="btn sm" data-act="discard" data-sku="${esc(a.sku)}">Write off</button>`,
  OUT_OF_STOCK: a => `<button class="btn sm" data-act="receive" data-sku="${esc(a.sku)}">Receive stock</button>`,
  REORDER: a => `<button class="btn sm" data-act="receive" data-sku="${esc(a.sku)}">Receive stock</button>`,
  EXPIRY_CRITICAL: () => `<button class="btn sm" data-act="goto" data-to="expiry">See batches</button>`,
  EXPIRY_SOON: () => `<button class="btn sm" data-act="goto" data-to="expiry">See batches</button>`,
  SHELF_FULL: () => `<button class="btn sm" data-act="goto" data-to="shelves">Rearrange</button>`,
  NO_SHELF: () => `<button class="btn sm" data-act="goto" data-to="shelves">Assign</button>`,
  NO_SPACE: () => `<button class="btn sm" data-act="goto" data-to="shelves">Rearrange</button>`,
};
const TYPE_LABEL = {EXPIRED: "Expired", EXPIRY_CRITICAL: "Expiry", EXPIRY_SOON: "Expiry", OUT_OF_STOCK: "Out of stock", REORDER: "Reorder", OVERSTOCK: "Overstock", SHELF_FULL: "Shelf space", NO_SPACE: "Shelf space", NO_SHELF: "Unassigned"};
const alertHTML = a => `<div class="alert ${esc(a.severity)}"><span class="bar"></span><div><span class="type">${esc(TYPE_LABEL[a.type] || a.type)}</span><div>${esc(a.message)}</div></div><div>${(ALERT_ACTION[a.type] || (() => ""))(a)}</div></div>`;

function salesChart(daily) {
  const W = 640, H = 190, pad = 28, max = Math.max(1, ...daily.map(d => d.revenue));
  const bw = (W - pad) / daily.length;
  const bars = daily.map((d, i) => {
    const h = d.revenue / max * (H - 40), hp = Math.max(0, d.profit) / max * (H - 40), x = pad + i * bw + bw * .16, w = bw * .68;
    return `<g><title>${fdate(d.date)}: ${d.units} units, sales ${inr0(d.revenue)}, profit ${inr0(d.profit)}</title>
      <rect x="${x}" y="${H - 22 - h}" width="${w}" height="${h}" fill="#c9d8cf"/><rect x="${x}" y="${H - 22 - hp}" width="${w}" height="${hp}" fill="#24523f"/>
      <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${new Date(d.date + "T00:00:00").getDate()}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales and profit for the last 14 days">
    <text x="0" y="12">${inr0(max)}</text><line x1="${pad}" x2="${W}" y1="${H - 22}" y2="${H - 22}" stroke="#d9dfda"/>${bars}</svg>
    <div class="legend"><span><i style="background:#c9d8cf"></i>Sales</span><span><i style="background:#24523f"></i>Profit</span></div>`;
}

routes.dashboard = async el => {
  const d = await api("GET", "/dashboard");
  const healthy = d.products - d.lowStock - d.outOfStock - d.overstock, tot = Math.max(1, d.products);
  const seg = (n, c) => n ? `<span style="width:${n / tot * 100}%;background:${c}" title="${n}"></span>` : "";
  const dateTxt = new Date(d.today + "T00:00:00").toLocaleDateString("en-IN", {weekday: "long", day: "numeric", month: "long"});
  el.innerHTML = `<header class="pagehead"><div><h1>${dateTxt}</h1><p class="muted">${d.products} products, ${d.units} units on the shelves, shelves ${num(d.shelfUsagePct, 0)}% full.</p></div>
      <div class="row"><button class="btn primary" data-act="goto" data-to="sales">Record a sale</button><button class="btn" data-act="goto" data-to="products">Add a product</button></div></header>
    <div class="stack">
    <dl class="ledger">
      <div><dt>Stock at cost</dt><dd>${inr0(d.stockCost)}</dd></div><div><dt>Stock at selling price</dt><dd>${inr0(d.stockRetail)}</dd></div>
      <div><dt>Total sales</dt><dd>${inr0(d.profit.revenue)}</dd></div><div><dt>Gross profit</dt><dd>${inr0(d.profit.grossProfit)}</dd></div>
      <div><dt>Wasted (expired)</dt><dd class="${d.profit.wastageLoss > 0 ? "neg" : ""}">${inr0(d.profit.wastageLoss)}</dd></div></dl>
    <section class="grid2">
      <div class="panel"><h2>Needs attention ${d.alertCounts.critical ? pill("crit", d.alertCounts.critical + " urgent") : ""}${d.alertCounts.warning ? pill("warn", d.alertCounts.warning + " to plan") : ""}</h2>
        ${d.alerts.length ? d.alerts.map(alertHTML).join("") : empty("Nothing needs attention right now.")}
        ${d.alertCounts.critical + d.alertCounts.warning + d.alertCounts.info > d.alerts.length ? `<p style="margin-top:.75rem"><a href="#alerts">See all ${d.alertCounts.critical + d.alertCounts.warning + d.alertCounts.info} alerts</a></p>` : ""}</div>
      <div class="stack">
        <div class="panel"><h2>Stock health</h2><div class="healthbar">${seg(healthy, "#2c7a4b")}${seg(d.lowStock, "#f2b01e")}${seg(d.outOfStock, "#c23b2b")}${seg(d.overstock, "#38679c")}</div>
          <div class="legend"><span><i style="background:#2c7a4b"></i>${healthy} healthy</span><span><i style="background:#f2b01e"></i>${d.lowStock} to reorder</span><span><i style="background:#c23b2b"></i>${d.outOfStock} out</span><span><i style="background:#38679c"></i>${d.overstock} overstocked</span></div>
          <p class="small muted" style="margin-top:.6rem">${d.expiredUnits} expired units on shelves; ${d.expiringBatches} batches expire within a week.</p></div>
        <div class="panel"><h2>Fastest sellers</h2><ul class="toplist">${d.topDemand.map(t => `<li><span>${esc(t.name)}<span class="small muted"> ${num(t.avgDaily)}/day</span></span>${meter(t.avgDaily / Math.max(.1, d.topDemand[0].avgDaily) * 100)}</li>`).join("")}</ul></div>
      </div></section>
    <div class="panel"><h2>Last 14 days</h2>${salesChart(d.daily)}</div></div>`;
};

let productQuery = "";
routes.products = async el => {
  await refs();
  const list = await api("GET", "/products" + (productQuery ? "?q=" + encodeURIComponent(productQuery) : ""));
  el.innerHTML = `<header class="pagehead"><div><h1>Products</h1><p class="muted">${list.length} shown. Each product keeps its stock in batches so the earliest expiry is sold first.</p></div>
    <div class="row"><input class="search" id="q" type="search" placeholder="Search SKU, name or category" value="${esc(productQuery)}" aria-label="Search products"><button class="btn primary" id="addp">Add product</button></div></header>
    <div class="tablewrap"><table><thead><tr><th>Product</th><th>Status</th><th class="num">Stock</th><th>Demand</th><th>Shelf</th><th>Next expiry</th><th class="num">Price</th><th class="num">Margin</th><th></th></tr></thead><tbody>
    ${list.map(p => `<tr><td><b>${esc(p.name)}</b><span class="sub">${esc(p.sku)} - ${esc(p.category)}</span></td>
      <td>${pill(p.status || "ok", STATUS[p.status] || "Healthy")}</td>
      <td class="num"><b>${p.stock}</b>${p.expired ? `<span class="sub" style="color:var(--crit)">${p.expired} expired</span>` : `<span class="sub">of ${p.target} target</span>`}</td>
      <td>${pill(p.demand || "Low", p.demand || "Low")}<span class="sub">${num(p.avgDaily)}/day</span></td>
      <td>${p.shelfName ? esc(p.shelfName) : '<span class="muted">Not assigned</span>'}</td><td class="nowrap">${p.nextExpiry ? fdate(p.nextExpiry) : '<span class="muted">-</span>'}</td>
      <td class="num">${inr(p.price)}<span class="sub">cost ${inr(p.cost)}</span></td><td class="num">${num(p.marginPct)}%</td>
      <td class="nowrap"><button class="btn sm" data-act="receive" data-sku="${esc(p.sku)}">Add stock</button> <button class="btn sm" data-edit="${esc(p.sku)}">Edit</button> <button class="btn sm" data-del="${esc(p.sku)}">Delete</button></td></tr>`).join("") || `<tr><td colspan="9">${empty("No products match.")}</td></tr>`}
    </tbody></table></div>`;
  let t; $("#q").oninput = e => { clearTimeout(t); t = setTimeout(() => { productQuery = e.target.value.trim(); reload(); setTimeout(() => { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 150); }, 350); };
  $("#addp").onclick = () => productForm();
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => productForm(list.find(p => p.sku === b.dataset.edit)));
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmDialog("Delete product", "Delete <b>" + esc(b.dataset.del) + "</b> and its stock records? Sales history is kept.", "Delete",
    async () => { await api("DELETE", "/products/" + encodeURIComponent(b.dataset.del)); toast("Product deleted"); reload(); }));
};
function productForm(p) {
  const edit = !!p;
  formDialog({
    title: edit ? "Edit " + p.name : "Add product",
    fields: [
      {name: "sku", label: "SKU", required: true, value: p?.sku, disabled: edit, placeholder: "e.g. MILK-1L", hint: edit ? "" : "Letters, digits, - and _"},
      {name: "name", label: "Name", required: true, value: p?.name},
      {name: "category", label: "Category", value: p?.category || "General", list: "zones", hint: "Used to pick a matching shelf zone"},
      {name: "supplierId", label: "Supplier", type: "select", options: supplierOpts("No supplier"), value: p?.supplierId},
      {name: "cost", label: "Cost price (₹)", type: "number", step: "0.01", min: 0, required: true, value: p?.cost},
      {name: "price", label: "Selling price (₹)", type: "number", step: "0.01", min: 0.01, required: true, value: p?.price},
      {name: "target", label: "Target stock (units)", type: "number", min: 1, required: true, value: p?.target, hint: "Level to restock up to"},
      {name: "safety", label: "Safety stock", type: "number", min: -1, value: p?.safety >= 0 ? p.safety : "", hint: "Blank = supplier default"},
      ...(edit ? [{name: "shelfId", label: "Shelf", type: "select", options: shelfOpts("Not assigned"), value: p.shelfId, wide: true}]
               : [{name: "shelfId", label: "Shelf", type: "select", options: shelfOpts("Pick automatically"), wide: true},
                  {name: "initialQty", label: "Opening stock", type: "number", min: 0, value: 0},
                  {name: "expiry", label: "Expiry of opening stock", type: "date", sendEmpty: true, hint: "Empty = non-perishable"}]),
    ],
    submit: edit ? "Save changes" : "Add product",
    onSubmit: async v => {
      if (edit) {
        delete v.sku;
        if (v.safety === undefined) v.safety = -1;  // blank = use the supplier default
        if (v.shelfId === p.shelfId || (!v.shelfId && !p.shelfId)) delete v.shelfId;
        await api("PUT", "/products/" + encodeURIComponent(p.sku), {...v, supplierId: v.supplierId || ""});
      } else await api("POST", "/products", v);
      toast(edit ? "Saved " + (v.name || p.name) : "Added " + v.name); reload();
    },
  });
  if (!$("#zones")) { const dl = document.createElement("datalist"); dl.id = "zones"; dl.innerHTML = [...new Set((cache.shelves || []).map(s => s.zone))].map(z => `<option value="${esc(z)}">`).join(""); document.body.appendChild(dl); }
}

routes.sales = async el => {
  const [prods, sales] = await Promise.all([api("GET", "/products"), api("GET", "/sales?limit=40")]);
  el.innerHTML = `<header class="pagehead"><div><h1>Sales</h1><p class="muted">Each sale takes stock from the batch that expires first and updates the shelf.</p></div></header>
    <div class="stack"><div class="panel"><h2>Record a sale</h2><form id="saleform" class="fields" novalidate>
      <div class="field wide"><label for="s_sku">Product</label><select id="s_sku" required>${prods.map(p => `<option value="${esc(p.sku)}"${p.sellable ? "" : " disabled"}>${esc(p.name)} (${esc(p.sku)}) - ${p.sellable} in stock</option>`).join("")}</select></div>
      <div class="field"><label for="s_units">Units sold</label><input id="s_units" type="number" min="1" value="1" required></div>
      <div class="field"><label for="s_date">Sale date <span class="hint">(optional, defaults to today)</span></label><input id="s_date" type="date"></div>
      <div class="field wide" id="s_preview"></div>
      <div class="field wide"><p class="formerr" id="s_err" role="alert"></p><button class="btn primary" id="s_btn">Record sale</button></div></form></div>
    <div><h2 style="margin-bottom:.6rem">Recent sales</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Product</th><th class="num">Units</th><th class="num">Sales</th><th class="num">Profit</th></tr></thead><tbody>
      ${sales.map(s => `<tr><td class="nowrap">${fdate(s.date)}</td><td>${esc(s.name)}<span class="sub">${esc(s.sku)}</span></td><td class="num">${s.units}</td><td class="num">${inr(s.revenue)}</td><td class="num">${inr(s.profit)}</td></tr>`).join("") || `<tr><td colspan="5">${empty("No sales yet.")}</td></tr>`}</tbody></table></div></div></div>`;
  const sel = $("#s_sku"), prev = $("#s_preview");
  const showPrev = () => {
    const p = prods.find(x => x.sku === sel.value); if (!p) { prev.textContent = ""; return; }
    const fresh = p.batches.filter(b => b.expiry === "" || b.expiry >= new Date().toISOString().slice(0, 10));
    prev.innerHTML = `<span class="muted small">${inr(p.price)} each. ` + (fresh.length ? "Next batch sold: <b>" + esc(fresh[0].id) + "</b> (" + fresh[0].qty + " units, expires " + fdate(fresh[0].expiry) + ")." : "No sellable stock.") + (p.expired ? ` ${p.expired} expired units are never sold.` : "") + `</span>`;
  };
  sel.onchange = showPrev; showPrev();
  $("#saleform").onsubmit = async e => {
    e.preventDefault(); $("#s_err").textContent = ""; $("#s_btn").disabled = true;
    try {
      const body = {sku: sel.value, units: Number($("#s_units").value)}; if ($("#s_date").value) body.date = $("#s_date").value;
      const r = await api("POST", "/sales", body);
      toast("Sold " + r.sale.units + " x " + r.sale.name + " for " + inr(r.sale.revenue) + ". " + r.product.stock + " left."); reload();
    } catch (err) { $("#s_err").textContent = err.message; $("#s_btn").disabled = false; }
  };
};

routes.shelves = async el => {
  const [v, prods] = await Promise.all([api("GET", "/shelves"), api("GET", "/products")]);
  const status = {}; prods.forEach(p => status[p.sku] = p.status);
  const shelfBlock = s => {
    const cls = s.usagePct >= 90 ? "hot" : s.usagePct >= 75 ? "warm" : "";
    return `<div class="shelf"><header><div><h3>${esc(s.name)} <span class="muted small">${esc(s.id)}, zone ${esc(s.zone)}</span></h3></div>
      <div class="row"><span class="small"><b>${s.used}</b> of ${s.capacity} used, ${s.free} free (${num(s.usagePct, 0)}%)</span><button class="btn sm" data-sedit="${esc(s.id)}">Edit</button><button class="btn sm" data-sdel="${esc(s.id)}">Delete</button></div></header>
      <div class="track" role="img" aria-label="${esc(s.name)} contents">${s.products.map(p => `<div class="item ${status[p.sku] || "ok"}" style="width:${p.stock / s.capacity * 100}%" title="${esc(p.name)}: ${p.stock} units${p.expired ? ", " + p.expired + " expired" : ""}"><b>${esc(p.name)}</b>${p.stock}${p.expired ? `<span class="exp" style="width:${p.expired / p.stock * 100}%"></span>` : ""}</div>`).join("")}<div class="free">${s.free > 0 ? s.free + " free" : "Full"}</div></div>
      ${meter(s.usagePct, cls)}</div>`;
  };
  el.innerHTML = `<header class="pagehead"><div><h1>Shelves</h1><p class="muted">Block width shows how much of the shelf each product takes. Hatched red marks expired units. Colour follows stock status.</p></div>
    <div class="row">${v.unassigned.length ? `<button class="btn" data-act="autoassign">Auto-assign ${v.unassigned.length} product(s)</button>` : ""}<button class="btn primary" id="addshelf">Add shelf</button></div></header>
    <div class="grid2"><div>${v.shelves.map(shelfBlock).join("") || empty("No shelves yet. Add one to start placing products.")}</div>
    <div class="stack"><div class="panel"><h2>Rearrangement suggestions</h2>${v.suggestions.length ? v.suggestions.map(s => `<div class="alert info"><span class="bar"></span><div><span class="type">${s.type === "move" ? "Move" : "Place"}</span><div>${s.type === "move" ? "Move" : "Put"} <b>${esc(s.name)}</b> (${s.units} units) ${s.fromShelf ? "from " + esc(s.fromShelf) + " " : ""}to <b>${esc(s.toShelf)}</b>. <span class="muted">${esc(s.reason)}.</span></div></div><button class="btn sm" data-act="assign" data-sku="${esc(s.sku)}" data-shelf="${esc(s.toShelf)}">Apply</button></div>`).join("") : empty("Shelf space looks balanced.")}</div>
    ${v.unassigned.length ? `<div class="panel"><h2>Not on any shelf</h2><ul>${v.unassigned.map(u => `<li>${esc(u.name)} (${u.stock} units)</li>`).join("")}</ul></div>` : ""}</div></div>`;
  $("#addshelf").onclick = () => shelfForm();
  el.querySelectorAll("[data-sedit]").forEach(b => b.onclick = () => shelfForm(v.shelves.find(s => s.id === b.dataset.sedit)));
  el.querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => confirmDialog("Delete shelf", "Delete shelf <b>" + esc(b.dataset.sdel) + "</b>? It must be empty.", "Delete",
    async () => { await api("DELETE", "/shelves/" + encodeURIComponent(b.dataset.sdel)); toast("Shelf deleted"); reload(); }));
};
actions.autoassign = () => guard(async () => { const r = await api("POST", "/shelves/auto-assign"); toast("Assigned " + r.assigned.length + " product(s)"); reload(); });
function shelfForm(s) {
  const edit = !!s;
  formDialog({
    title: edit ? "Edit " + s.name : "Add shelf",
    fields: [
      {name: "id", label: "Shelf ID", required: true, value: s?.id, disabled: edit, placeholder: "e.g. SH-F1"},
      {name: "name", label: "Name", required: true, value: s?.name},
      {name: "zone", label: "Zone", value: s?.zone || "General", hint: "Matches product categories; 'General' takes anything"},

  el.innerHTML = `<header class="pagehead"><div><h1>Expiry and FEFO</h1><p class="muted">First Expired, First Out: batches are listed in the order they should be sold.</p></div>
    <div class="row"><label for="soon" style="margin:0">Warn within</label><select id="soon" style="width:auto">${[3, 7, 14, 30].map(n => `<option value="${n}"${n === soonDays ? " selected" : ""}>${n} days</option>`).join("")}</select>
    ${d.expiredUnits ? `<button class="btn danger" data-act="discard">Write off ${d.expiredUnits} expired units</button>` : ""}</div></header>
    <div class="stack"><dl class="ledger"><div><dt>Expired units</dt><dd class="${d.expiredUnits ? "neg" : ""}">${d.expiredUnits}</dd></div><div><dt>Cost of expired stock</dt><dd>${inr0(d.expiredValue)}</dd></div><div><dt>Units expiring within ${d.soonDays} days</dt><dd>${d.expiringUnits}</dd></div></dl>

let demandDays = 30;

  const d = await api("GET", "/demand?days=" + demandDays), mx = Math.max(.1, ...d.map(x => x.avgDaily));
  el.innerHTML = `<header class="pagehead"><div><h1>Demand</h1><p class="muted">Average daily demand = units sold / days. Products are ranked, then split into High, Medium and Low thirds (nothing sold = Low).</p></div>

    <div class="tablewrap"><table><thead><tr><th class="num">Rank</th><th>Product</th><th>Demand</th><th class="num">Units sold</th><th class="num">Per day</th><th style="width:30%"></th></tr></thead><tbody>
    ${d.map(x => `<tr><td class="num">${x.rank}</td><td>${esc(x.name)}<span class="sub">${esc(x.sku)}</span></td><td>${pill(x.level, x.level)}</td><td class="num">${x.totalSold}</td><td class="num">${num(x.avgDaily, 2)}</td><td>${meter(x.avgDaily / mx * 100)}</td></tr>`).join("")}</tbody></table></div>`;

routes.profit = async el => {
  const [p, w] = await Promise.all([api("GET", "/profit"), api("GET", "/wastage")]), s = p.summary, mx = Math.max(1, ...p.products.map(x => x.marginPct));
  el.innerHTML = `<header class="pagehead"><div><h1>Profit</h1><p class="muted">Profit per unit = selling price - cost price. Margin = profit per unit / selling price x 100.</p></div><a class="btn" href="/api/export/profit">Export CSV</a></header>
    <div class="stack"><dl class="ledger"><div><dt>Sales</dt><dd>${inr0(s.revenue)}</dd></div><div><dt>Cost of goods sold</dt><dd>${inr0(s.costOfGoods)}</dd></div><div><dt>Gross profit</dt><dd>${inr0(s.grossProfit)}</dd></div>
      <div><dt>Wastage</dt><dd class="${s.wastageLoss ? "neg" : ""}">${inr0(s.wastageLoss)}</dd></div><div><dt>Net profit</dt><dd>${inr0(s.netProfit)}</dd></div><div><dt>Overall margin</dt><dd>${num(s.marginPct)}%</dd></div></dl>
    <div class="tablewrap"><table><thead><tr><th>Product</th><th class="num">Cost</th><th class="num">Price</th><th class="num">Profit / unit</th><th class="num">Margin</th><th></th><th class="num">Units sold</th><th class="num">Total profit</th></tr></thead><tbody>
    ${p.products.map(x => `<tr><td>${esc(x.name)}<span class="sub">${esc(x.sku)}</span></td><td class="num">${inr(x.costPrice)}</td><td class="num">${inr(x.sellPrice)}</td><td class="num">${inr(x.profitPerUnit)}</td><td class="num">${num(x.marginPct)}%</td><td style="width:14%">${meter(x.marginPct / mx * 100)}</td><td class="num">${x.unitsSold}</td><td class="num"><b>${inr(x.totalProfit)}</b></td></tr>`).join("")}</tbody></table></div>
    <div><h2 style="margin-bottom:.6rem">Wastage log</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Product</th><th>Batch</th><th class="num">Units</th><th class="num">Cost lost</th></tr></thead><tbody>
    ${w.slice().reverse().map(x => `<tr><td>${fdate(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.batchId)}</td><td class="num">${x.qty}</td><td class="num">${inr(x.cost)}</td></tr>`).join("") || `<tr><td colspan="5">${empty("Nothing written off yet.")}</td></tr>`}</tbody></table></div></div></div>`;
};

routes.suppliers = async el => {
  const list = await api("GET", "/suppliers");
  el.innerHTML = `<header class="pagehead"><div><h1>Suppliers</h1><p class="muted">Lead time and safety stock feed the reorder point of every product bought from them.</p></div><button class="btn primary" id="adds">Add supplier</button></header>
    <div class="tablewrap"><table><thead><tr><th>Supplier</th><th>Phone</th><th class="num">Lead time</th><th class="num">Safety stock</th><th class="num">Products</th><th></th></tr></thead><tbody>
    ${list.map(s => `<tr><td><b>${esc(s.name)}</b><span class="sub">${esc(s.id)}</span></td><td>${esc(s.phone || "-")}</td><td class="num">${s.leadTime} day(s)</td><td class="num">${s.safetyStock}</td><td class="num">${s.products}</td>
      <td class="nowrap"><button class="btn sm" data-sedit="${esc(s.id)}">Edit</button> <button class="btn sm" data-sdel="${esc(s.id)}">Delete</button></td></tr>`).join("") || `<tr><td colspan="6">${empty("No suppliers yet.")}</td></tr>`}</tbody></table></div>`;
  const form = s => { const edit = !!s; formDialog({ title: edit ? "Edit " + s.name : "Add supplier", fields: [
      {name: "id", label: "Supplier ID", required: true, value: s?.id, disabled: edit, placeholder: "e.g. SUP5"}, {name: "name", label: "Name", required: true, value: s?.name},
      {name: "phone", label: "Phone", value: s?.phone}, {name: "leadTime", label: "Lead time (days)", type: "number", min: 0, required: true, value: s?.leadTime},
      {name: "safetyStock", label: "Default safety stock (units)", type: "number", min: 0, value: s?.safetyStock ?? 0, wide: true}],
    submit: edit ? "Save changes" : "Add supplier",
    onSubmit: async v => { if (edit) { delete v.id; await api("PUT", "/suppliers/" + encodeURIComponent(s.id), v); } else await api("POST", "/suppliers", v); toast("Supplier saved"); reload(); } }); };
  $("#adds").onclick = () => form();
  el.querySelectorAll("[data-sedit]").forEach(b => b.onclick = () => form(list.find(s => s.id === b.dataset.sedit)));
  el.querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => confirmDialog("Delete supplier", "Delete supplier <b>" + esc(b.dataset.sdel) + "</b>?", "Delete",
    async () => { await api("DELETE", "/suppliers/" + encodeURIComponent(b.dataset.sdel)); toast("Supplier deleted"); reload(); }));
};

routes.data = async el => {
  el.innerHTML = `<header class="pagehead"><div><h1>Data</h1><p class="muted">Everything is saved to JSON files in the server's data folder after every change.</p></div></header>
    <div class="stack"><div class="panel"><h2>Export</h2><div class="row"><a class="btn" href="/api/export/products">Products CSV</a><a class="btn" href="/api/export/sales">Sales CSV</a><a class="btn" href="/api/export/profit">Profit CSV</a><a class="btn" href="/api/export/reorder">Reorder CSV</a></div></div>
    <div class="panel"><h2>Reset to demo data</h2><p class="muted">Replaces every product, shelf, supplier and sale with a sample shop that has 30 days of sales history, expired and expiring batches, and low and overstocked items.</p><p style="margin-top:.8rem"><button class="btn danger" id="seed">Replace all data with demo data</button></p></div></div>`;
  $("#seed").onclick = () => confirmDialog("Replace all data?", "This deletes your current products, shelves, suppliers and sales and loads the demo shop. It cannot be undone.", "Replace everything",
    async () => { await api("POST", "/seed", {confirm: true}); toast("Demo data loaded"); reload(); });
};

go();
setInterval(refreshBadge, 60000);
</script>
</body>
</html>
